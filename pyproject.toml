[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrade"
version = "0.1.0"
description = "Entorno de paper trading para evaluar agentes de trading contra un benchmark, con costos incluidos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40"]
dev = ["pytest>=8"]

[project.scripts]
papertrade = "papertrade.cli:main"

[tool.setuptools.packages.find]
include = ["papertrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
