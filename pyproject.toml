[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrade"
version = "0.1.0"
description = "Plataforma de trading agéntico: un agente LLM decide, un motor de riesgo determinista valida, un broker ejecuta."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "httpx2>=2.13",
    "tzdata; sys_platform == 'win32'",  # Windows has no system time zone database for zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentrade = "agentrade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
